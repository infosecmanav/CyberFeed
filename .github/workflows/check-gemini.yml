name: Check Gemini Models

on:
  workflow_dispatch:
    inputs:
      test_generation:
        description: Also send one minimal JSON generation request (uses API quota)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: List Gemini generation models
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python -m cyberbrief.gemini_models
      - name: Test minimal Gemini generation
        if: inputs.test_generation == true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python -m cyberbrief.gemini_models --test-generation
