name: Build Cyber Briefing
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m cyberbrief.cli build --format all --out site
      - uses: actions/upload-artifact@v4
        with:
          name: briefing-reports
          path: site
