name: Scheduled Discord Briefings
on:
  workflow_dispatch:
    inputs:
      period:
        description: Report period
        type: choice
        options:
          - daily
          - weekly
        default: daily
      format:
        description: Report format
        type: choice
        options:
          - pdf
          - text
        default: pdf
  schedule:
    # Several opportunities make GitHub's best-effort scheduler resilient.
    # The Toronto gate and delivery marker allow only one successful delivery.
    - cron: '50 12-18 * * *'
    - cron: '30 12-18 * * 5'
permissions:
  contents: read
  actions: write
concurrency:
  group: daily-discord-briefing
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      period: ${{ steps.gate.outputs.period }}
      delivery_key: ${{ steps.gate.outputs.delivery_key }}
      already_delivered: ${{ steps.delivery-marker.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Toronto morning slot
        id: gate
        env:
          REPORT_PERIOD: ${{ inputs.period || 'daily' }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: python3 -m cyberbrief.schedule
      - name: Check successful delivery marker
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'schedule'
        id: delivery-marker
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .state/delivery-marker
          key: ${{ steps.gate.outputs.delivery_key }}
          lookup-only: true
  deliver:
    needs: schedule
    if: needs.schedule.outputs.enabled == 'true' && needs.schedule.outputs.already_delivered != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install and test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Check AI and Discord configuration
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS }}
          AI_JSON_MODE: ${{ vars.AI_JSON_MODE }}
          AI_GEMINI_TRANSPORT: ${{ vars.AI_GEMINI_TRANSPORT }}
          AI_REPAIR_ATTEMPTS: ${{ vars.AI_REPAIR_ATTEMPTS }}
          AI_BATCH_SIZE: ${{ vars.AI_BATCH_SIZE }}
        run: |
          python - <<'PY'
          import os
          from cyberbrief.ai import AIConfig, AIError, preflight
          try:
              config = AIConfig.from_env()
              if not os.getenv('DISCORD_WEBHOOK_URL'):
                  raise AIError('Add DISCORD_WEBHOOK_URL in repository Actions secrets before running.')
              preflight(config)
          except AIError as error:
              raise SystemExit(str(error)) from None
          PY
      - name: Build report for the Toronto delivery window
        # Preserve explicit source warnings in the report if coverage is partial.
        env:
          REPORT_PERIOD: ${{ needs.schedule.outputs.period }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS }}
          AI_JSON_MODE: ${{ vars.AI_JSON_MODE }}
          AI_GEMINI_TRANSPORT: ${{ vars.AI_GEMINI_TRANSPORT }}
          AI_REPAIR_ATTEMPTS: ${{ vars.AI_REPAIR_ATTEMPTS }}
          AI_BATCH_SIZE: ${{ vars.AI_BATCH_SIZE }}
        run: python -m cyberbrief.cli build --ai --period "$REPORT_PERIOD" --scheduled-window --format all --out site
      - name: Save failed report diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-diagnostics-${{ github.run_id }}
          path: |
            site/source-report.json
            site/validation-error.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.schedule.outputs.period }}-briefing-${{ github.run_id }}
          path: site
          retention-days: 7
          if-no-files-found: error
      - name: Send report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_FORMAT: ${{ inputs.format || vars.BRIEFING_FORMAT || 'pdf' }}
        run: python -m cyberbrief.webhook --out site --format "$REPORT_FORMAT"
      - name: Create successful delivery marker
        if: github.event_name == 'schedule'
        run: |
          mkdir -p .state
          date -u > .state/delivery-marker
      - name: Save successful delivery marker
        if: github.event_name == 'schedule'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .state/delivery-marker
          key: ${{ needs.schedule.outputs.delivery_key }}
